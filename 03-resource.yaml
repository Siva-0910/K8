apiVersion: v1
kind: Pod
metadata:
  name: resources-robo
  namespace: roboshop-ns
  labels:
    name: pod-resources
    project: roboshop
    env: dev
spec:
  containers:
  - name: nginx
    image: nginx  
    resources:
      requests:
        cpu: "100m"
        memory: "68mi"
      limits:
        cpu: "250m"
        memory: "100mi"    