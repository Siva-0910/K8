apiVersion: v1
kind: Service
metadata:
  name: service-nodeport
  labels:
    name: service-nodeport
spec:
 type: NodePort
 selector:
   purpose: nodeport-demo
   project: roboshop
   env: dev
  ports:
  - protocol: TCP
    port: 80
    targertPort: 80

---

apiVersion: v1
kind: Pod
metadata:
  name: nginx-nodeport
  labels:
    purpose: nodeport-demo
    project: roboshop
    env: dev
spec:
  containers:
  - name: nginx
    image: nginx    