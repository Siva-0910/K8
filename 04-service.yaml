apiVersion : v1
kind: Service
metadata:
  name: service-demo
  labels:
    purpose: service-demo
spec:
  selector:
    purpose: service-demo
    project: roboshop
    env: dev    
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---

apiVersion: v1
kind: Pod
metadata:
  name: pod-service
  labels:
    purpose: service-demo
    project: roboshop
    env: dev
spec:
  containers:
  - name: nginx
    image: nginx    