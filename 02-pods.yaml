apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    project: roboshop
    environment: test
spec:
  containers:
  - name: nginx
    image: nginx
    envFrom:
      - configMapRef:
          name: pod-congig
    resources:
      requests:
        memory: "68Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "150m"
          
